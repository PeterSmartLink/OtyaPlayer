plugins {
    id "com.android.application"
    // Kotlin is required because MainActivity and Android platform bridges are
    // implemented in .kt files.
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Otya has one canonical app-icon binary. Android launcher resources are
// generated from the same validated WebP Flutter ships in-app so launcher,
// splash/header identity and public branding cannot drift independently.
def otyaBrandSource = file("../../assets/branding/otya_app_icon.webp")
def generatedOtyaBrandRes = file("${buildDir}/generated/otya-brand-res")

android {
    namespace = "com.otyaplayer.app"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            java.srcDirs += "src/main/kotlin"
            res.srcDir generatedOtyaBrandRes
        }
    }

    defaultConfig {
        applicationId = "com.otyaplayer.app"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true

        // Otya v1 currently ships its own UI in English only. Android/system
        // components still localize themselves normally; this only avoids
        // bundling unused app/library resource locales into the APK.
        resourceConfigurations += ["en"]
        vectorDrawables.useSupportLibrary = true
    }

    def releaseTaskRequested = gradle.startParameter.taskNames.any {
        it.toLowerCase().contains("release")
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: "keystore.jks"
            def keystoreFile = file(keystorePath)
            def allowDebugSigning = (System.getenv("OTYA_ALLOW_DEBUG_SIGNING") ?: "false").toBoolean()

            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = System.getenv("STORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            } else if (allowDebugSigning && releaseTaskRequested) {
                println("WARNING: OTYA_ALLOW_DEBUG_SIGNING=true — CI/test release artifact will use the Android debug key and MUST NOT be published.")
                storeFile = file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            } else if (releaseTaskRequested) {
                throw new GradleException(
                    "Production release signing key not found at '${keystorePath}'. " +
                    "Provide KEYSTORE_PATH/STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD. " +
                    "Only CI test release builds may explicitly set OTYA_ALLOW_DEBUG_SIGNING=true."
                )
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
        debug {
            debuggable = true
            // Debug/test APKs intentionally use Android's disposable debug key.
            // Production signing material is reserved for release/Play workflows.
        }
    }
}

tasks.register("prepareOtyaBrandResources") {
    inputs.file(otyaBrandSource)
    outputs.dir(generatedOtyaBrandRes)

    doLast {
        if (!otyaBrandSource.exists() || otyaBrandSource.length() < 12) {
            throw new GradleException("Canonical Otya app icon is missing or empty: ${otyaBrandSource}")
        }
        byte[] header = new byte[12]
        otyaBrandSource.withInputStream { stream ->
            if (stream.read(header) != 12) {
                throw new GradleException("Could not read canonical Otya app icon header")
            }
        }
        if (new String(header, 0, 4, "US-ASCII") != "RIFF" ||
            new String(header, 8, 4, "US-ASCII") != "WEBP") {
            throw new GradleException("Canonical Otya app icon is not a WebP container")
        }

        def drawableDir = new File(generatedOtyaBrandRes, "drawable-nodpi")
        drawableDir.mkdirs()
        copy {
            from otyaBrandSource
            into drawableDir
            rename { "otya_launcher_source.webp" }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareOtyaBrandResources")
}

flutter {
    source = "../.."
}

dependencies {
    implementation("androidx.multidex:multidex:2.0.1")
    implementation("androidx.window:window:1.3.0")
    implementation("androidx.window:window-java:1.3.0")
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
    implementation("androidx.annotation:annotation:1.7.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
}
