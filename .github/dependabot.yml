version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Africa/Kampala"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
    groups:
      flutter-safe-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:15"
      timezone: "Africa/Kampala"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
    groups:
      android-safe-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Africa/Kampala"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
    groups:
      github-actions-safe-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
