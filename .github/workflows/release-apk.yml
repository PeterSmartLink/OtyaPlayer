name: Release APK — direct install

on:
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  release_apk:
    name: Validate and build signed ARM64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Verify direct-install build authority
        shell: bash
        env:
          REQUESTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REQUESTED_REF" = 'refs/heads/main' || {
            echo "ERROR: signed direct-install release APKs may only be built from main; got $REQUESTED_REF"
            exit 1
          }

      - name: Checkout exact current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Verify checkout is current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main --force
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          test "$HEAD_SHA" = "$MAIN_SHA" || {
            echo "ERROR: direct-install release checkout is not current main; checkout=$HEAD_SHA main=$MAIN_SHA"
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock || { echo 'ERROR: committed pubspec.lock is missing'; exit 1; }
          BEFORE="$(sha256sum pubspec.lock | awk '{print $1}')"
          flutter pub get
          AFTER="$(sha256sum pubspec.lock | awk '{print $1}')"
          test "$BEFORE" = "$AFTER" || {
            git diff -- pubspec.lock
            echo 'ERROR: flutter pub get changed the committed dependency graph'
            exit 1
          }
          git diff --exit-code -- pubspec.lock

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analysis — zero issues required
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Verify semantic release identity
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(awk '/^version:[[:space:]]*/ { print $2; exit }' pubspec.yaml)"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]] || {
            echo "ERROR: release build must use <version>+<positive build>; found $APP_VERSION"
            exit 1
          }

      - name: Verify required release configuration
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_API_KEY" || { echo "ERROR: FIREBASE_API_KEY GitHub variable is missing"; exit 1; }
          test -n "$KEYSTORE_BASE64" || { echo "ERROR: KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ERROR: STORE_PASSWORD secret is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: KEY_ALIAS secret is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: KEY_PASSWORD secret is missing"; exit 1; }

      - name: Prepare Otya signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          test -s android/app/keystore.jks || { echo "ERROR: decoded keystore is empty"; exit 1; }

      - name: Build optimized ARM64 release APK
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          OTYA_SELF_UPDATE: 'true'
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/android-release-config.sh
          flutter build apk --release \
            --target-platform android-arm64 \
            "${OTYA_RELEASE_DART_DEFINES[@]}"

      - name: Verify APK, runtime contract and signing certificate
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          REPORT=build/release-apk-signing-cert.txt
          test -f "$APK" || { echo "ERROR: release APK not found"; exit 1; }
          test "$(stat -c%s "$APK")" -gt 5000000 || { echo "ERROR: APK suspiciously small"; exit 1; }

          mkdir -p build/release-apk-evidence
          bash scripts/verify-android-release-apk.sh "$APK" build/release-apk-evidence
          sha256sum "$APK" | tee build/release-apk-sha256.txt

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER" || { echo "ERROR: Android apksigner was not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$REPORT"

          EXPECTED_SHA256="$(keytool -list -v \
            -keystore android/app/keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA256="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$REPORT" \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"

          test -n "$EXPECTED_SHA256" || { echo "ERROR: expected signing certificate is unavailable"; exit 1; }
          test -n "$ACTUAL_SHA256" || { echo "ERROR: APK signing certificate was not reported"; exit 1; }
          test "$EXPECTED_SHA256" = "$ACTUAL_SHA256" || {
            echo "ERROR: release APK certificate does not match the configured Otya signing key"
            exit 1
          }
          cp "$APK" build/Otya-arm64-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: otya-arm64-release-apk
          if-no-files-found: error
          retention-days: 3
          path: |
            build/Otya-arm64-release.apk
            build/release-apk-sha256.txt
            build/release-apk-signing-cert.txt
            build/release-apk-evidence/**

      - name: Remove signing material
        if: always()
        run: rm -f android/app/keystore.jks
