name: One-shot Anywhere player polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-anywhere-player-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact guarded player polish
        env:
          EXPECTED_PARENT: ca7e5a1b384ff9795fbd75d0061ebfe0f9007a3c
          TARGET: lib/features/player/presentation/video_player_screen.dart
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/player/presentation/video_player_screen.dart')
          text = path.read_text()
          old = "    _position = _savedPosition;\n    WidgetsBinding.instance.addObserver(this);\n"
          new = "    _position = _savedPosition;\n    _anywhereTogetherActive = AnywhereTogetherRuntime.instance.active;\n    WidgetsBinding.instance.addObserver(this);\n"
          if text.count(old) != 1:
              raise SystemExit('init anchor changed')
          text = text.replace(old, new, 1)
          old = "        _duration = widget.mediaItem.duration;\n"
          new = "        _duration = widget.mediaItem.duration ?? Duration.zero;\n"
          if text.count(old) != 1:
              raise SystemExit('duration anchor changed')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/one-shot-anywhere-player-polish.yml
          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add "$TARGET" .github/workflows/one-shot-anywhere-player-polish.yml
          git commit -m 'fix(together): harden Anywhere player restore state'
          git push origin HEAD:main
