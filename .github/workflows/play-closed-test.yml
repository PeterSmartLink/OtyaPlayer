name: Build Play closed-test AAB

on:
  workflow_dispatch:

concurrency:
  group: play-closed-test-aab
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  build_play_aab:
    name: Validate and build Play closed-test bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Prove current main and first-release identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)" || {
            echo "ERROR: Play closed-test bundle must be built from current main"
            exit 1
          }
          APP_VERSION="$(awk '/^version:[[:space:]]*/ { print $2; exit }' pubspec.yaml)"
          [[ "$APP_VERSION" =~ ^1\.0\.0\+[1-9][0-9]*$ ]] || {
            echo "ERROR: Otya first-release Play builds must stay 1.0.0+<positive build>; found $APP_VERSION"
            exit 1
          }

      - name: Validate required signing and Firebase configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          required=(KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD FIREBASE_API_KEY)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'ERROR: Missing Play closed-test build configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Block tracked secret and signing files
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          if printf '%s\n' "$tracked" | grep -E '(^|/)(\.env($|\.)|\.dev\.vars$|key\.properties$|keystore\.jks$|.*\.(jks|keystore|p12|pfx|pem|key)$|.*firebase-adminsdk.*\.json$|service-account.*\.json$)' | grep -Ev '(^|/)\.env\.example$'; then
            echo '::error::Potential credential or signing material is tracked.'
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock || { echo 'ERROR: committed pubspec.lock is missing'; exit 1; }
          BEFORE="$(sha256sum pubspec.lock | awk '{print $1}')"
          flutter pub get
          AFTER="$(sha256sum pubspec.lock | awk '{print $1}')"
          test "$BEFORE" = "$AFTER" || {
            git diff -- pubspec.lock
            echo 'ERROR: flutter pub get changed the committed dependency graph'
            exit 1
          }
          git diff --exit-code -- pubspec.lock

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check code strictly
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Load official signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          test -s android/app/keystore.jks || {
            echo "ERROR: Otya release signing key is empty"
            exit 1
          }

      - name: Build Play closed-test AAB with shared production runtime config
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          OTYA_SELF_UPDATE: 'false'
        run: |
          set -euo pipefail
          rm -rf build/app/outputs/bundle build/play-closed-test build/debug-info
          source scripts/android-release-config.sh
          flutter build appbundle --release \
            --split-debug-info=build/debug-info \
            "${OTYA_RELEASE_DART_DEFINES[@]}"
          mkdir -p build/play-closed-test
          cp build/app/outputs/bundle/release/app-release.aab build/play-closed-test/Otya-Play-closed-test.aab

      - name: Verify Play bundle identity and signature
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          AAB=build/play-closed-test/Otya-Play-closed-test.aab
          REPORT=build/play-closed-test/Otya-Play-closed-test-signing.txt
          CHECKSUM=build/play-closed-test/Otya-Play-closed-test-sha256.txt
          VERSION=build/play-closed-test/Otya-Play-closed-test-version.txt

          test -f "$AAB" || { echo "ERROR: Play AAB not found"; exit 1; }
          test "$(stat -c%s "$AAB")" -gt 5000000 || { echo "ERROR: Play AAB is unexpectedly small"; exit 1; }

          jarsigner -verify "$AAB" | tee "$REPORT"
          keytool -printcert -jarfile "$AAB" >> "$REPORT"

          EXPECTED_SHA256="$(keytool -list -v \
            -keystore android/app/keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA256="$(sed -n 's/^[[:space:]]*SHA256: //p' "$REPORT" \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          test -n "$EXPECTED_SHA256" && test -n "$ACTUAL_SHA256" || {
            echo "ERROR: Play AAB signing certificate could not be verified"
            exit 1
          }
          test "$EXPECTED_SHA256" = "$ACTUAL_SHA256" || {
            echo "ERROR: Play AAB certificate does not match the configured Otya signing key"
            exit 1
          }

          APP_VERSION="$(awk '/^version:[[:space:]]*/ { print $2; exit }' pubspec.yaml)"
          printf 'Otya %s\nsource=%s\nself_update=false\n' "$APP_VERSION" "$(git rev-parse HEAD)" | tee "$VERSION"
          sha256sum "$AAB" | tee "$CHECKSUM"

      - name: Save Play closed-test bundle
        uses: actions/upload-artifact@v4
        with:
          name: Otya-Play-closed-test
          if-no-files-found: error
          retention-days: 3
          path: |
            build/play-closed-test/Otya-Play-closed-test.aab
            build/play-closed-test/Otya-Play-closed-test-signing.txt
            build/play-closed-test/Otya-Play-closed-test-sha256.txt
            build/play-closed-test/Otya-Play-closed-test-version.txt

      - name: Remove signing key
        if: always()
        run: rm -f android/app/keystore.jks
