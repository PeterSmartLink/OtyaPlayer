name: One-shot active media session ownership fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-media-session-owner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make music claim MediaSession only during real playback
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/features/player/presentation/audio_player_screen.dart')
          s = p.read_text()

          init_line = '    AudioHandlerSingleton.instance.attachPlayer(_player);\n'
          init_pos = s.find(init_line, s.find('  void init() {'))
          streams_pos = s.find('    _attachStreams();', s.find('  void init() {'))
          if init_pos < 0 or streams_pos < 0 or init_pos > streams_pos:
              raise SystemExit('audio init ownership line changed')
          s = s[:init_pos] + s[init_pos + len(init_line):]

          register_line = "      await PlaybackCoordinator.instance.register(_player, 'audio');\n"
          register_pos = s.find(register_line, s.find('Future<bool> _loadCurrent('))
          if register_pos < 0:
              raise SystemExit('audio load registration changed')
          guard = '      if (!isCurrent()) return false;\n'
          guard_pos = s.find(guard, register_pos + len(register_line))
          if guard_pos < 0:
              raise SystemExit('audio load current guard changed')
          insert_pos = guard_pos + len(guard)
          ownership_line = '      AudioHandlerSingleton.instance.attachPlayer(_player);\n'
          if s.find(ownership_line, register_pos, insert_pos + len(ownership_line)) < 0:
              s = s[:insert_pos] + ownership_line + s[insert_pos:]

          mini_line = '    _container?.read(miniPlayerItemProvider.notifier).state = item;\n'
          mini_pos = s.find(mini_line, s.find('Future<void> load('))
          if mini_pos < 0:
              raise SystemExit('mini player item assignment changed')
          early_notification = '    _updateNotification();\n'
          early_pos = s.find(early_notification, mini_pos + len(mini_line))
          saved_pos = s.find('    final saved = OtyaDatabase.instance.getSeekPosition(item.id);', mini_pos)
          if early_pos >= 0 and (saved_pos < 0 or early_pos < saved_pos):
              s = s[:early_pos] + s[early_pos + len(early_notification):]

          record_line = '      OtyaDatabase.instance.recordPlay(item).ignore();\n'
          record_pos = s.find(record_line, s.find('Future<void> load('))
          if record_pos < 0:
              raise SystemExit('record play line changed')
          success_notification = '      _updateNotification();\n'
          if s[max(0, record_pos - len(success_notification)):record_pos] != success_notification:
              s = s[:record_pos] + success_notification + s[record_pos:]

          init_start = s.find('  void init() {')
          init_end = s.find('  void _attachStreams()', init_start)
          if 'AudioHandlerSingleton.instance.attachPlayer(_player)' in s[init_start:init_end]:
              raise SystemExit('idle audio still owns MediaSession')
          if ownership_line.strip() not in s[register_pos:register_pos + 500]:
              raise SystemExit('active audio ownership missing')

          p.write_text(s)
          PY

          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add lib/features/player/presentation/audio_player_screen.dart
          git commit -m 'fix(playback): claim MediaSession only for active audio'
          git push origin HEAD:main
