name: Validate Otya release mode

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-mode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  release_mode:
    name: Build release-mode publication candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Block tracked secrets and signing material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(google-services.*\.json|.*firebase-adminsdk.*\.json|.*service-account.*\.json|.*\.jks|.*\.keystore|.*\.p12|.*\.pem)$'; then
            echo 'ERROR: private credentials/signing files must not be tracked'
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Ensure Android debug key exists for non-publishable release-mode test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Build release-mode ARM64 APK with production runtime config
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          OTYA_ALLOW_DEBUG_SIGNING: 'true'
          OTYA_SELF_UPDATE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/android-release-config.sh
          flutter build apk --release \
            --target-platform android-arm64 \
            "${OTYA_RELEASE_DART_DEFINES[@]}"
          mkdir -p build/release-mode-evidence
          cp build/app/outputs/flutter-apk/app-release.apk build/Otya-release-mode-test.apk

      - name: Verify final release-mode Android binary
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-android-release-apk.sh \
            build/Otya-release-mode-test.apk \
            build/release-mode-evidence

      - name: Save release-mode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Otya-release-mode-validation
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/Otya-release-mode-test.apk
            build/release-mode-evidence/**
