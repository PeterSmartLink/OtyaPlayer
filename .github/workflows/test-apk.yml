name: Test Otya

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-otya-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  validate_and_build:
    name: Check and build Otya
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Block tracked secret and signing files
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          if printf '%s\n' "$tracked" | grep -E '(^|/)(\.env($|\.)|\.dev\.vars$|key\.properties$|keystore\.jks$|.*\.(jks|keystore|p12|pfx|pem|key)$|.*firebase-adminsdk.*\.json$|service-account.*\.json$)' | grep -Ev '(^|/)\.env\.example$'; then
            echo '::error::Potential credential or signing material is tracked.'
            exit 1
          fi

      - name: Block private keys and provider tokens
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- '^-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----$'; then
            echo '::error::Private key material is committed.'
            exit 1
          fi
          if git grep -n -I -E -- '"type"[[:space:]]*:[[:space:]]*"service_account"'; then
            echo '::error::A Google/Firebase service-account document is committed.'
            exit 1
          fi
          if git grep -n -I -E -- '"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN'; then
            echo '::error::Embedded JSON private-key material is committed.'
            exit 1
          fi
          if git grep -n -I -E -- '[0-9]{8,12}:[A-Za-z0-9_-]{25,}'; then
            echo '::error::Possible Telegram bot token committed to source.'
            exit 1
          fi
          if git grep -n -I -E -- '\bre_[A-Za-z0-9_-]{20,}\b'; then
            echo '::error::Possible Resend API key committed to source.'
            exit 1
          fi
          if git grep -n -I -E -- '\b(ghp|github_pat)_[A-Za-z0-9_]{20,}\b'; then
            echo '::error::Possible GitHub access token committed to source.'
            exit 1
          fi
          if git grep -n -I -E -- '\bsk-[A-Za-z0-9_-]{20,}\b'; then
            echo '::error::Possible AI/provider secret key committed to source.'
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check code strictly
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Check Firebase settings
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_API_KEY" || { echo "ERROR: FIREBASE_API_KEY is missing"; exit 1; }

      - name: Build test APK
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --target-platform android-arm64 \
            --dart-define=SELF_UPDATE=true \
            --dart-define=GOOGLE_WEB_CLIENT_ID="82776565585-obr8k53b8n6djsggissv8qne81cm3u5u.apps.googleusercontent.com" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="1:82776565585:android:085cf9b4eecb76e9535570" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="82776565585" \
            --dart-define=FIREBASE_PROJECT_ID="otya-player"
          cp build/app/outputs/flutter-apk/app-debug.apk build/Otya-test.apk

      - name: Verify test APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/Otya-test.apk
          test -f "$APK" || { echo "ERROR: Otya test APK not found"; exit 1; }
          test "$(stat -c%s "$APK")" -gt 5000000 || { echo "ERROR: APK is too small"; exit 1; }
          sha256sum "$APK" | tee build/Otya-test-checksum.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo "ERROR: Android apksigner was not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/Otya-test-signing.txt

      - name: Save Otya test APK
        uses: actions/upload-artifact@v4
        with:
          name: Otya-test
          if-no-files-found: error
          retention-days: 7
          path: |
            build/Otya-test.apk
            build/Otya-test-checksum.txt
            build/Otya-test-signing.txt
