name: Sync Otya brand assets to Cloudflare R2

on:
  push:
    branches:
      - main
    paths:
      - 'assets/branding/**'
      - '.github/workflows/sync-brand-assets.yml'
  workflow_dispatch:

concurrency:
  group: sync-otya-brand-assets
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync approved Otya branding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare R2 configuration
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            test -n "${!name:-}" || { echo "ERROR: Missing $name"; exit 1; }
          done
          [[ "$R2_ENDPOINT" == https://* ]] || { echo "ERROR: R2_ENDPOINT must use HTTPS"; exit 1; }

      - name: Decode and validate approved Otya image
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install pillow --quiet
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          p = Path('assets/branding/otya_app_icon.webp')
          if not p.is_file():
              raise SystemExit('ERROR: canonical Otya app icon is missing')
          try:
              with Image.open(p) as image:
                  if image.format != 'WEBP':
                      raise SystemExit(f'ERROR: expected WebP, got {image.format!r}')
                  image.load()
                  if image.width <= 0 or image.height <= 0:
                      raise SystemExit('ERROR: Otya icon has invalid dimensions')
                  print(f'Validated decoded WebP: {image.width}x{image.height}, {p.stat().st_size} bytes')
          except SystemExit:
              raise
          except Exception as exc:
              raise SystemExit(f'ERROR: Otya branding image cannot be decoded: {exc}')
          PY

      - name: Install AWS CLI
        run: pip install awscli --quiet

      - name: Upload and verify Otya app icon
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          SRC='assets/branding/otya_app_icon.webp'
          STABLE_KEY='assets/branding/otya-app-icon.webp'
          test -s "$SRC" || { echo "ERROR: Missing approved Otya icon"; exit 1; }

          SHA256="$(sha256sum "$SRC" | awk '{print $1}')"
          VERSIONED_KEY="assets/branding/otya-app-icon-${SHA256:0:12}.webp"
          LOCAL_SIZE="$(stat -c%s "$SRC")"

          aws s3 cp "$SRC" "s3://${R2_BUCKET}/${VERSIONED_KEY}" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type image/webp \
            --cache-control 'public, max-age=31536000, immutable'

          aws s3 cp "$SRC" "s3://${R2_BUCKET}/${STABLE_KEY}" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type image/webp \
            --cache-control 'public, max-age=300, must-revalidate'

          REMOTE_SIZE="$(aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$STABLE_KEY" \
            --endpoint-url "$R2_ENDPOINT" \
            --query ContentLength \
            --output text)"

          test "$REMOTE_SIZE" = "$LOCAL_SIZE" || {
            echo "ERROR: R2 verification failed: local=$LOCAL_SIZE remote=$REMOTE_SIZE"
            exit 1
          }

          # Remove the malformed object produced by the interrupted first transfer.
          aws s3 rm "s3://${R2_BUCKET}/assets/branding/otya-app-icon-9d415ff48b08.webp" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1 || true

          echo "Uploaded $STABLE_KEY"
          echo "Uploaded $VERSIONED_KEY"
          echo "SHA256=$SHA256"
