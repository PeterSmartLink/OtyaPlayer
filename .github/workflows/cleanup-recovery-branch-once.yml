name: One-time Otya recovery cleanup

on:
  push:
    branches:
      - fix/publish-visible-new-way-20260906

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v6
        with:
          ref: fix/publish-visible-new-way-20260906
          fetch-depth: 0

      - name: Remove dead product files safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          router = root / 'lib/app/router.dart'
          text = router.read_text()
          text = text.replace("'assets/icons/play_store_512.png'", "'assets/branding/otya_app_icon.webp'")
          text = text.replace("const Text('OTYA')", "const Text('Otya')")
          text = text.replace("const Text('Back to OTYA')", "const Text('Back to Otya')")
          router.write_text(text)

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')

          def referenced(candidate: str, tokens: list[str]) -> bool:
              for name in tracked:
                  if not name or name == candidate or name.startswith('docs/archive/'):
                      continue
                  path = root / name
                  try:
                      haystack = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  if any(token in haystack for token in tokens):
                      print(f'KEEP {candidate}: referenced by {name}')
                      return True
              return False

          candidates = {
              'assets/icons/play_store_512.png': ['assets/icons/play_store_512.png', 'play_store_512.png'],
              'assets/branding/otya_mark.svg': ['assets/branding/otya_mark.svg', 'otya_mark.svg'],
              'assets/themes/otya_mountains.jpg': ['assets/themes/otya_mountains.jpg', 'otya_mountains.jpg'],
              'assets/animations/otya_ai_thinking.svg': ['assets/animations/otya_ai_thinking.svg', 'otya_ai_thinking.svg'],
              'assets/onboarding/owner_photo.b64': ['assets/onboarding/owner_photo.b64', 'owner_photo.b64'],
              'scripts/apply_ui_polish.py': ['scripts/apply_ui_polish.py', 'apply_ui_polish.py'],
              'scripts/fix_thumbnail_pipeline.py': ['scripts/fix_thumbnail_pipeline.py', 'fix_thumbnail_pipeline.py'],
              '.release-trigger': ['.release-trigger'],
              'lib/features/settings/presentation/settings_with_ai_screen.dart': [
                  'settings_with_ai_screen.dart', 'SettingsWithAiScreen'
              ],
              'lib/shared/widgets/pro_gate.dart': ['pro_gate.dart', 'ProGate'],
          }

          for candidate, tokens in candidates.items():
              path = root / candidate
              if not path.exists():
                  continue
              if referenced(candidate, tokens):
                  continue
              print(f'REMOVE {candidate}')
              path.unlink()
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/cleanup-recovery-branch-once.yml
          if git diff --quiet; then
            echo 'No cleanup changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove dead Otya app files'
          git push origin HEAD:fix/publish-visible-new-way-20260906
