name: One-shot unblock device runtime patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-unblock-device-runtime.yml

permissions:
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove formatter dependency and retrigger patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/dart format lib\/features\/player\/presentation\/video_player_screen.dart test\/video_system_media_session_contract_test.dart/d" .github/workflows/one-shot-device-runtime-fix.yml
          rm .github/workflows/one-shot-unblock-device-runtime.yml
          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add .github/workflows/one-shot-device-runtime-fix.yml .github/workflows/one-shot-unblock-device-runtime.yml
          git commit -m 'chore: unblock device runtime patch execution'
          git push origin HEAD:main
