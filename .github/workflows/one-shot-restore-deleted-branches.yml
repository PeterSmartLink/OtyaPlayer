name: One-shot restored-branch audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Classify every non-main branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/git/matching-refs/heads/" --jq '.[].ref' |
          sed 's#^refs/heads/##' | sort | while IFS= read -r branch; do
            [ "$branch" = "main" ] && continue
            gh api "repos/$REPO/compare/main...$branch" |
              jq -r --arg branch "$branch" '
                "AUDIT|" + $branch +
                "|status=" + .status +
                "|ahead=" + (.ahead_by|tostring) +
                "|behind=" + (.behind_by|tostring) +
                "|files=" + ([.files[].filename] | join(","))'
          done
