name: Refine Otya video pointer owner

on:
  push:
    branches:
      - fix/publish-visible-new-way-20260906
    paths:
      - scripts/refine_video_pointer_owner.py
      - .github/workflows/refine-video-pointer-owner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v6
        with:
          ref: fix/publish-visible-new-way-20260906
          fetch-depth: 0

      - name: Refine video pointer owner
        run: python3 scripts/refine_video_pointer_owner.py

      - name: Remove one-time helpers
        run: |
          rm scripts/refine_video_pointer_owner.py
          rm .github/workflows/refine-video-pointer-owner.yml

      - name: Commit pointer ownership fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: give video gestures one pointer owner"
          git push origin HEAD:fix/publish-visible-new-way-20260906
