name: Apply video thumbnail quality once

on:
  push:
    branches:
      - fix/publish-visible-new-way-20260906
    paths:
      - .github/workflows/apply-video-thumbnail-quality-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/publish-visible-new-way-20260906
          fetch-depth: 0

      - name: Apply source migration
        run: python3 scripts/upgrade_video_thumbnail_quality.py

      - name: Remove one-time migration helpers
        run: |
          rm scripts/upgrade_video_thumbnail_quality.py
          rm .github/workflows/apply-video-thumbnail-quality-once.yml

      - name: Commit upgraded thumbnail pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(video): generate crisp v2 local thumbnails"
          git push origin HEAD:fix/publish-visible-new-way-20260906
