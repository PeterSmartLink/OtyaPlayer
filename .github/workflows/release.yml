# Otya production release pipeline.
# Public version remains 1.0.0 while each published binary gets an immutable
# build-specific tag such as v1.0.0+2.

name: Release

on:
  push:
    tags:
      - 'v1.0.0+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable build tag to publish (for example v1.0.0+2)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  build_and_publish:
    name: Build and publish Otya 1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production
    permissions:
      contents: write

    steps:
      - name: Resolve immutable release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG='${{ inputs.tag }}'
          else
            TAG='${{ github.ref_name }}'
          fi
          [[ "$TAG" =~ ^v1\.0\.0\+[1-9][0-9]*$ ]] || {
            echo "ERROR: Otya release tags must look like v1.0.0+2; refusing $TAG"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate production release configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          required=(
            KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD FIREBASE_API_KEY
            R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET
            WORKER_URL CF_ACCOUNT_ID CF_API_TOKEN
          )
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'ERROR: Missing production release configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

      - name: Prove tag, main and pubspec are the same build
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main --force
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null || {
            echo "ERROR: release tag $RELEASE_TAG does not exist"
            exit 1
          }

          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$HEAD_SHA" = "$MAIN_SHA" || {
            echo "ERROR: release checkout is not current main; checkout=$HEAD_SHA main=$MAIN_SHA"
            exit 1
          }
          test "$TAG_SHA" = "$MAIN_SHA" || {
            echo "ERROR: immutable tag $RELEASE_TAG does not point to current main"
            exit 1
          }

          APP_VERSION="$(awk '/^version:[[:space:]]*/ { print $2; exit }' pubspec.yaml)"
          test "$APP_VERSION" = "${RELEASE_TAG#v}" || {
            echo "ERROR: tag $RELEASE_TAG does not exactly match pubspec version $APP_VERSION"
            exit 1
          }
          [[ "$APP_VERSION" =~ ^1\.0\.0\+[1-9][0-9]*$ ]] || {
            echo "ERROR: expected Otya 1.0.0+<positive build>; found $APP_VERSION"
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install locked dependencies and publisher tools
        shell: bash
        run: |
          set -euo pipefail
          pip install awscli --quiet
          test -s pubspec.lock || { echo 'ERROR: committed pubspec.lock is missing'; exit 1; }
          BEFORE="$(sha256sum pubspec.lock | awk '{print $1}')"
          flutter pub get
          AFTER="$(sha256sum pubspec.lock | awk '{print $1}')"
          test "$BEFORE" = "$AFTER" || {
            git diff -- pubspec.lock
            echo 'ERROR: flutter pub get changed the committed dependency graph'
            exit 1
          }
          git diff --exit-code -- pubspec.lock

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flutter analyze 2>&1 | tee build/flutter-analyze-release.log

      - name: Test
        run: flutter test

      - name: Load official signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          test -s android/app/keystore.jks || {
            echo "ERROR: release signing key is empty"
            exit 1
          }

      - name: Build APKs and Play bundle from one production configuration
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/release build/debug-info
          source scripts/android-release-config.sh

          configure_otya_release_defines true
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --split-debug-info=build/debug-info/apk \
            "${OTYA_RELEASE_DART_DEFINES[@]}"

          configure_otya_release_defines false
          flutter build appbundle --release \
            --split-debug-info=build/debug-info/aab \
            "${OTYA_RELEASE_DART_DEFINES[@]}"

      - name: Name, verify and fingerprint publication artifacts
        id: artifacts
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_DIR=build/app/outputs/flutter-apk
          RAW_ARM64="$APK_DIR/app-arm64-v8a-release.apk"
          RAW_ARM32="$APK_DIR/app-armeabi-v7a-release.apk"
          RAW_AAB=build/app/outputs/bundle/release/app-release.aab
          OUT=build/release
          mkdir -p "$OUT"

          test -s "$RAW_ARM64" || { echo "ERROR: arm64 APK missing"; exit 1; }
          test -s "$RAW_ARM32" || { echo "ERROR: arm32 APK missing"; exit 1; }
          test -s "$RAW_AAB" || { echo "ERROR: AAB missing"; exit 1; }

          cp "$RAW_ARM64" "$OUT/Otya-arm64.apk"
          cp "$RAW_ARM32" "$OUT/Otya-arm32.apk"
          cp "$RAW_AAB" "$OUT/Otya.aab"

          ARM64="$OUT/Otya-arm64.apk"
          ARM32="$OUT/Otya-arm32.apk"
          AAB="$OUT/Otya.aab"

          # The same final-binary checks used by PR release validation must pass
          # on the exact APKs that are about to be published.
          bash scripts/verify-android-release-apk.sh "$ARM64" "$OUT/evidence-arm64"
          bash scripts/verify-android-release-apk.sh "$ARM32" "$OUT/evidence-arm32"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo "ERROR: apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$ARM64" | tee "$OUT/Otya-arm64-signing.txt"
          "$APKSIGNER" verify --verbose --print-certs "$ARM32" | tee "$OUT/Otya-arm32-signing.txt"

          EXPECTED_SHA256="$(keytool -list -v \
            -keystore android/app/keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          test -n "$EXPECTED_SHA256" || { echo "ERROR: official signing certificate unavailable"; exit 1; }

          for REPORT in "$OUT/Otya-arm64-signing.txt" "$OUT/Otya-arm32-signing.txt"; do
            ACTUAL_SHA256="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$REPORT" \
              | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || {
              echo "ERROR: APK certificate does not match official Otya signing key"
              exit 1
            }
          done

          jarsigner -verify "$AAB" | tee "$OUT/Otya-aab-signing.txt"
          keytool -printcert -jarfile "$AAB" >> "$OUT/Otya-aab-signing.txt"
          AAB_SHA256="$(sed -n 's/^[[:space:]]*SHA256: //p' "$OUT/Otya-aab-signing.txt" \
            | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$AAB_SHA256" = "$EXPECTED_SHA256" || {
            echo "ERROR: AAB certificate does not match official Otya signing key"
            exit 1
          }

          sha256sum "$ARM64" "$ARM32" "$AAB" | tee "$OUT/checksums.txt"
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
          echo "arm32=$ARM32" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "checksums=$OUT/checksums.txt" >> "$GITHUB_OUTPUT"

      - name: Save exact release evidence
        uses: actions/upload-artifact@v4
        with:
          name: Otya-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          retention-days: 3
          path: |
            build/release/**
            build/flutter-analyze-release.log

      - name: Publish verified APKs to R2 and release control plane
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ARM64_APK: ${{ steps.artifacts.outputs.arm64 }}
          ARM32_APK: ${{ steps.artifacts.outputs.arm32 }}
        run: bash scripts/publish_r2.sh

      - name: Create GitHub release from the same verified files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Otya ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifacts.outputs.arm64 }}
            ${{ steps.artifacts.outputs.arm32 }}
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.artifacts.outputs.checksums }}

      - name: Remove signing material
        if: always()
        run: rm -f android/app/keystore.jks
