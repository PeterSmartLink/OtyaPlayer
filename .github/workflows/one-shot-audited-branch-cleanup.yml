name: One-shot audited branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-audited-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only audited unchanged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS='|' read -r branch expected; do
            [ -n "$branch" ] || continue
            if current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
              if [ "$current" != "$expected" ]; then
                echo "REFUSED_CHANGED|$branch|expected=$expected|current=$current"
                failed=1
                continue
              fi
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null
              echo "DELETED|$branch|$current"
            else
              echo "ALREADY_GONE|$branch"
            fi
          done <<'EOF'
          audit/direct-install-main-authority-20260904|378ff3fe846772826676d146eebcfbd782094506
          audit/release-authority-20260904|c10f2308cebec3c1fe8d8ebd1b5740e351421285
          audit/transfer-security-boundary-20260904|670d8dfdd2dde38048ce39c62166621825bb1ffe
          dependabot/github_actions/github-actions-c4a8201dc3|11d003b7aa7b0daa8dce24f8f6dcd09474b9c15c
          dependabot/gradle/android/android-dependencies-37732ed4d0|800cf42a3b53490de1c8075699e807fa07183cd9
          feat/anywhere-together-transport-20260907|8709f2def8bcdce7a012c4adae6df79b134db911
          fix/accessibility-touch-targets-20260904|2b52657c6f98d2141160cdb6aa8cf169607f47d6
          fix/audio-service-notification-config-20260903|74b27ce6b67ea0bd44c3cda2bc5dc1e15c17fd57
          fix/contextual-media-permission-20260904|e87f7a031c18356b0abbf20d9be8ddac62fce26c
          fix/final-otya-hardening-20260907|fb176d7137311234a34e2f0e542afb888a373452
          fix/modern-visual-system-20260904|a767eaa86d1aa27ba5cb9b00f39094b3103f7da8
          fix/play-closed-test-aab-20260904|36a5175201f94739a19a9b00615a5e168afd0b80
          fix/player-accessibility-polish-20260904|d14af738b4926af862023133104f99f8018a0257
          fix/publish-visible-new-way-20260906|f22af7df5399f6983de8e7b2435ec2c07bce8449
          fix/release-blockers-current-20260903|1ba10060d3205a0357615228e7370167685d7d91
          fix/release-blockers-final-20260903|1ba10060d3205a0357615228e7370167685d7d91
          fix/release-workflow-observability-20260904|1f944fc82c303dd684fd0862edc67d6234521ddd
          fix/together-reliability-20260907|729e60b40873e668c132e3a9928d795cf68ef7c1
          fix/transfer-offline-connect-20260905|63e36ee953677052cfe1d3f70e6508240ad96686
          fix/video-library-crash-noise-20260904|65a0ebc1f91e71ee308766f7b35560745a056c1e
          integrate/anywhere-together-transport-20260907|c75cc91e28c22724128a334cd08b7858bd5308ac
          otya-new-way|96a9a05987e867358954e1eab5e97a802de2b896
          spike/anywhere-webrtc-budget-20260907|f364efee24990d43dee8572281744826c89cc609
          ui/brand-everywhere-20260905|a2a27b68c7025300960915f05bd3a970e9fa9913
          ui/brand-playlists-audio-20260905|1f85d0eae652829bb2f97e3bdf9f7caac76a2e82
