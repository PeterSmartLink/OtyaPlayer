name: One-shot wire Together inbox

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-wire-together-inbox.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Wire in-app Together invitation inbox
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          client = Path('lib/features/together/data/together_control_client.dart')
          text = client.read_text()

          rooms_anchor = "  Uri get _roomsUri => Uri.parse('${Environment.workerUrl}/api/together/rooms');\n"
          if "_invitesUri" not in text:
              text = text.replace(
                  rooms_anchor,
                  rooms_anchor + "  Uri get _invitesUri => Uri.parse('${Environment.workerUrl}/api/together/invites');\n",
                  1,
              )

          join_sig_old = """  Future<TogetherControlResult<TogetherRemoteRoom>> joinRoom({
            required String roomId,
            required String inviteToken,
          }) async {"""
          join_sig_new = """  Future<TogetherControlResult<TogetherRemoteRoom>> joinRoom({
            required String roomId,
            String inviteToken = '',
          }) async {"""
          if join_sig_old in text:
              text = text.replace(join_sig_old, join_sig_new, 1)
          elif join_sig_new not in text:
              raise SystemExit('joinRoom signature changed')

          body_old = "        body: jsonEncode({'invite_token': inviteToken}),\n"
          body_new = "        body: jsonEncode(inviteToken.trim().isEmpty ? <String, Object?>{} : {'invite_token': inviteToken}),\n"
          if body_old in text:
              text = text.replace(body_old, body_new, 1)
          elif body_new not in text:
              raise SystemExit('joinRoom body changed')

          get_room_anchor = "  Future<TogetherControlResult<TogetherRemoteRoom>> getRoom(String roomId) async {\n"
          if "pendingInvites()" not in text:
              pending_method = """  Future<TogetherControlResult<List<TogetherRemoteRoom>>> pendingInvites() async {
            final auth = await _authorization();
            if (auth == null) return _signedOut();

            try {
              final response = await AppHttpClient.instance.client.get(
                _invitesUri,
                headers: {'Authorization': auth},
              ).timeout(_timeout);
              final data = _decode(response.body);
              if (response.statusCode != 200 || data?['invites'] is! List) {
                return _error(data, 'Could not load Together invitations.');
              }
              final invites = (data!['invites'] as List)
                  .whereType<Map>()
                  .map((item) => TogetherRemoteRoom.fromJson(
                        Map<String, dynamic>.from(item),
                      ))
                  .where((room) => room.roomId.isNotEmpty)
                  .toList(growable: false);
              return TogetherControlResult(value: invites);
            } catch (_) {
              return _networkError();
            }
          }

"""
              if get_room_anchor not in text:
                  raise SystemExit('getRoom anchor changed')
              text = text.replace(get_room_anchor, pending_method + get_room_anchor, 1)

          client.write_text(text)

          runtime = Path('lib/features/together/application/anywhere_together_runtime.dart')
          rt = runtime.read_text()
          rt_old = """  Future<AnywherePlaybackPlan> joinGuest({
            required String roomId,
            required String inviteToken,
            required Player player,"""
          rt_new = """  Future<AnywherePlaybackPlan> joinGuest({
            required String roomId,
            String inviteToken = '',
            required Player player,"""
          if rt_old in rt:
              rt = rt.replace(rt_old, rt_new, 1)
          elif rt_new not in rt:
              raise SystemExit('runtime joinGuest signature changed')
          runtime.write_text(rt)

          sheet = Path('lib/features/together/presentation/anywhere_together_sheet.dart')
          s = sheet.read_text()
          import_anchor = "import '../application/anywhere_together_runtime.dart';\n"
          if "../data/together_control_client.dart" not in s:
              s = s.replace(
                  import_anchor,
                  import_anchor + "import '../data/together_control_client.dart';\n",
                  1,
              )

          old_fields = """class _AnywhereJoinSheetState extends State<_AnywhereJoinSheet> {
            final _inviteController = TextEditingController();
            bool _working = false;
            String? _error;

            AnywhereTogetherRuntime get _runtime => AnywhereTogetherRuntime.instance;
"""
          new_fields = """class _AnywhereJoinSheetState extends State<_AnywhereJoinSheet> {
            final _inviteController = TextEditingController();
            bool _working = false;
            bool _loadingInvites = true;
            List<TogetherRemoteRoom> _invites = const [];
            String? _error;

            AnywhereTogetherRuntime get _runtime => AnywhereTogetherRuntime.instance;

            @override
            void initState() {
              super.initState();
              _loadInvites();
            }

            Future<void> _loadInvites() async {
              final result = await TogetherControlClient.instance.pendingInvites();
              if (!mounted) return;
              setState(() {
                _loadingInvites = false;
                _invites = result.value ?? const [];
                if (!result.ok && result.code != 'SIGN_IN_REQUIRED') {
                  _error = result.error;
                }
              });
            }

            Future<void> _joinPending(TogetherRemoteRoom room) async {
              if (_working) return;
              setState(() {
                _working = true;
                _error = null;
              });
              try {
                final plan = await _runtime.joinGuest(
                  roomId: room.roomId,
                  player: widget.player,
                  candidateMediaItem: widget.currentMediaItem,
                );
                if (!mounted) return;
                Navigator.of(context).pop(plan);
              } catch (_) {
                if (!mounted) return;
                setState(() {
                  _working = false;
                  _error = _runtime.lastError ?? 'OTYA could not join this private room.';
                });
              }
            }
"""
          if old_fields in s:
              s = s.replace(old_fields, new_fields, 1)
          elif "Future<void> _loadInvites()" not in s:
              raise SystemExit('join sheet fields changed')

          old_heading = """          const _SheetHeading(
            icon: Icons.link_rounded,
            title: 'Join Anywhere',
            subtitle: 'Paste the private invite sent by your friend. OTYA will reuse your local copy when it matches.',
          ),
          const SizedBox(height: 18),
          TextField(
"""
          new_heading = """          const _SheetHeading(
            icon: Icons.groups_rounded,
            title: 'Join Anywhere',
            subtitle: 'Invitations sent to your OTYA username appear here. OTYA reuses your local copy when it matches, saving mobile data.',
          ),
          const SizedBox(height: 16),
          if (_loadingInvites)
            const Center(
              child: Padding(
                padding: EdgeInsets.symmetric(vertical: 14),
                child: CircularProgressIndicator(strokeWidth: 2),
              ),
            )
          else if (_invites.isNotEmpty) ...[
            for (final room in _invites)
              Container(
                margin: const EdgeInsets.only(bottom: 10),
                padding: const EdgeInsets.all(14),
                decoration: BoxDecoration(
                  color: AppColors.surfaceElevated.withValues(alpha: .72),
                  borderRadius: BorderRadius.circular(18),
                  border: Border.all(color: AppColors.borderSubtle),
                ),
                child: Row(
                  children: [
                    const CircleAvatar(
                      backgroundColor: AppColors.surfaceHighlight,
                      child: Icon(Icons.person_rounded, color: AppColors.brandCyan),
                    ),
                    const SizedBox(width: 12),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            room.host.displayName?.trim().isNotEmpty == true
                                ? room.host.displayName!
                                : room.host.handle,
                            style: const TextStyle(
                              color: AppColors.textPrimary,
                              fontWeight: FontWeight.w800,
                            ),
                          ),
                          const SizedBox(height: 2),
                          Text(
                            '${room.host.handle} invited you to watch Together',
                            style: const TextStyle(
                              color: AppColors.textSecondary,
                              fontSize: 12,
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(width: 10),
                    FilledButton(
                      onPressed: _working ? null : () => _joinPending(room),
                      child: const Text('Join'),
                    ),
                  ],
                ),
              ),
            const SizedBox(height: 6),
          ] else
            Container(
              padding: const EdgeInsets.all(14),
              decoration: BoxDecoration(
                color: AppColors.surfaceElevated.withValues(alpha: .5),
                borderRadius: BorderRadius.circular(18),
                border: Border.all(color: AppColors.borderSubtle),
              ),
              child: const Text(
                'No pending invitations yet. Ask your friend to choose your @username when they start Together.',
                style: TextStyle(
                  color: AppColors.textSecondary,
                  fontSize: 12.5,
                  height: 1.4,
                ),
              ),
            ),
          const SizedBox(height: 16),
          const Text(
            'Older invite link',
            style: TextStyle(
              color: AppColors.textMuted,
              fontSize: 12,
              fontWeight: FontWeight.w700,
            ),
          ),
          const SizedBox(height: 8),
          TextField(
"""
          if old_heading in s:
              s = s.replace(old_heading, new_heading, 1)
          elif "Invitations sent to your OTYA username appear here" not in s:
              raise SystemExit('join heading changed')

          s = s.replace("labelText: 'Private invite',", "labelText: 'Fallback private invite',", 1)
          s = s.replace("label: Text(_working ? 'Connecting phones…' : 'Join private room'),", "label: Text(_working ? 'Connecting phones…' : 'Join from link'),", 1)

          old_host_sub = "subtitle: 'Send this private invite only to @${invite.guestUsername}. Keep OTYA open while they join.',"
          new_host_sub = "subtitle: 'OTYA invited @${invite.guestUsername} inside the app. They can open Together and tap Join. Keep OTYA open while they connect.',"
          if old_host_sub in s:
              s = s.replace(old_host_sub, new_host_sub, 1)
          s = s.replace("label: const Text('Copy private invite'),", "label: const Text('Copy fallback invite'),", 1)

          sheet.write_text(s)

          test = Path('test/together_in_app_invite_contract_test.dart')
          test.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  final client = File('lib/features/together/data/together_control_client.dart').readAsStringSync();
  final runtime = File('lib/features/together/application/anywhere_together_runtime.dart').readAsStringSync();
  final sheet = File('lib/features/together/presentation/anywhere_together_sheet.dart').readAsStringSync();

  test('Together can discover authenticated in-app invitations', () {
    expect(client, contains('/api/together/invites'));
    expect(client, contains('pendingInvites()'));
    expect(sheet, contains('_loadInvites()'));
    expect(sheet, contains('invited you to watch Together'));
  });

  test('pending invitation can join without copying a secret link', () {
    expect(client, contains("inviteToken.trim().isEmpty ? <String, Object?>{}"));
    expect(runtime, contains("String inviteToken = ''"));
    expect(sheet, contains('_joinPending(TogetherRemoteRoom room)'));
    expect(sheet, contains("child: const Text('Join')"));
  });

  test('private link remains fallback rather than primary join path', () {
    expect(sheet, contains("'Older invite link'"));
    expect(sheet, contains("labelText: 'Fallback private invite'"));
    expect(sheet, contains("'Copy fallback invite'"));
  });
}
""")
          PY

          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add lib/features/together/data/together_control_client.dart lib/features/together/application/anywhere_together_runtime.dart lib/features/together/presentation/anywhere_together_sheet.dart test/together_in_app_invite_contract_test.dart
          git commit -m 'feat(together): join invited friends inside OTYA'
          git push origin HEAD:main
