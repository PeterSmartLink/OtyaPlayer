name: One-shot main-only branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          failures=0
          gh api --paginate "repos/$REPO/git/matching-refs/heads/" --jq '.[].ref' | while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            [ "$ref" = "refs/heads/main" ] && continue
            branch="${ref#refs/heads/}"
            echo "Deleting $branch"
            if ! gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"; then
              echo "::error::Failed to delete $branch"
              failures=1
            fi
          done
          exit "$failures"
