name: Apply Together ambient overlay once

on:
  push:
    branches:
      - fix/publish-visible-new-way-20260906
    paths:
      - .github/workflows/apply-together-ambient-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/publish-visible-new-way-20260906
          fetch-depth: 0

      - name: Integrate ambient Together layer
        run: python3 scripts/integrate_together_ambient_overlay.py

      - name: Remove one-time helpers
        run: |
          rm scripts/integrate_together_ambient_overlay.py
          rm .github/workflows/apply-together-ambient-once.yml

      - name: Commit video compositor integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(together): show live activity over video"
          git push origin HEAD:fix/publish-visible-new-way-20260906
