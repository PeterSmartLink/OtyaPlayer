name: Resolve WebRTC spike lock

on:
  push:
    branches:
      - spike/anywhere-webrtc-budget-20260907
    paths:
      - pubspec.yaml
      - .github/workflows/webrtc-lock-spike.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spike branch
        uses: actions/checkout@v5
        with:
          ref: spike/anywhere-webrtc-budget-20260907
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Resolve exact dependency graph
        run: flutter pub get

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already matches the WebRTC spike."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "spike(together): lock WebRTC dependency graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
