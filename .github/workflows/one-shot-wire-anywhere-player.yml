name: One-shot wire Anywhere player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-wire-anywhere-player.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wire Anywhere into the existing player lifecycle
        env:
          EXPECTED_PARENT: 3dac63110019354dad246d2fe3e00faeb1cf5248
          TARGET: lib/features/player/presentation/video_player_screen.dart
          SCRIPT: .github/scripts/one_shot_wire_anywhere_player.py
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -s "$SCRIPT"
          python3 "$SCRIPT"
          grep -q 'AnywhereTogetherRuntime' "$TARGET"
          grep -q 'showTogetherEntrySheet' "$TARGET"
          grep -q 'isAllowedAnywhereTogetherMediaUri' "$TARGET"
          rm "$SCRIPT" .github/workflows/one-shot-wire-anywhere-player.yml
          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add "$TARGET" "$SCRIPT" .github/workflows/one-shot-wire-anywhere-player.yml
          git commit -m 'feat(together): wire Anywhere into OTYA player'
          git push origin HEAD:main
