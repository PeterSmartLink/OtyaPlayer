name: One-shot app Actions optimization

on:
  push:
    paths:
      - '.github/workflows/optimize-actions-once.yml'

permissions:
  contents: write

concurrency:
  group: optimize-app-actions-once
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Reduce APK artifact churn and duplicate release validation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'Expected pattern not found in {path}: {old!r}')
              if count is not None and found != count:
                  raise SystemExit(f'Expected {count} matches in {path}, found {found}: {old!r}')
              p.write_text(text.replace(old, new))

          # Ordinary app CI still validates/builds, but workflow/docs-only edits
          # no longer start a full Flutter/Gradle build.
          replace_required(
              '.github/workflows/test-apk.yml',
              "  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n",
              "  push:\n    branches: [main]\n    paths-ignore:\n      - '**/*.md'\n      - 'docs/**'\n      - '.github/**'\n  pull_request:\n    branches: [main]\n    paths-ignore:\n      - '**/*.md'\n      - 'docs/**'\n      - '.github/**'\n",
              count=1,
          )

          # Do not store a full test APK for every push/PR. Explicit manual
          # test builds remain downloadable for three days.
          test_apk = Path('.github/workflows/test-apk.yml')
          text = test_apk.read_text()
          marker = '      - name: Save Otya test APK\n        uses: actions/upload-artifact@v4\n'
          if marker not in text:
              raise SystemExit('Test APK upload step marker missing')
          text = text.replace(
              marker,
              "      - name: Save Otya test APK\n        if: github.event_name == 'workflow_dispatch'\n        uses: actions/upload-artifact@v4\n",
              1,
          )
          text = text.replace('          retention-days: 7\n', '          retention-days: 3\n', 1)
          test_apk.write_text(text)

          # Release-mode validation is redundant on every direct main push:
          # the normal app CI validates pushes and the real release workflow
          # performs full signed publication validation. Keep PR/manual coverage.
          replace_required(
              '.github/workflows/release-mode-validation.yml',
              "  push:\n    branches:\n      - main\n    paths:\n      - 'lib/**'\n      - 'android/**'\n      - 'test/**'\n      - 'scripts/**'\n      - 'pubspec.yaml'\n      - 'pubspec.lock'\n      - '.github/workflows/release-mode-validation.yml'\n  pull_request:\n",
              '  pull_request:\n',
              count=1,
          )
          mode = Path('.github/workflows/release-mode-validation.yml')
          text = mode.read_text()
          upload = '        uses: actions/upload-artifact@v4\n'
          if upload not in text:
              raise SystemExit('Release-mode artifact upload marker missing')
          text = text.replace(upload, "        if: github.event_name == 'workflow_dispatch'\n" + upload, 1)
          text = text.replace('          retention-days: 7\n', '          retention-days: 3\n', 1)
          mode.write_text(text)

          # Permanent release files already live in R2/GitHub Releases, so
          # transient Actions evidence does not need multi-week retention.
          replace_required('.github/workflows/release.yml', '          retention-days: 30\n', '          retention-days: 3\n', count=1)
          replace_required('.github/workflows/release-apk.yml', '          retention-days: 14\n', '          retention-days: 3\n', count=1)
          replace_required('.github/workflows/play-closed-test.yml', '          retention-days: 14\n', '          retention-days: 3\n', count=1)
          replace_required('test/play_closed_test_workflow_contract_test.dart', "contains('retention-days: 14')", "contains('retention-days: 3')", count=1)

          Path('.github/workflows/optimize-actions-once.yml').unlink()
          PY

      - name: Commit optimized app workflow policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'petersmartlink@gmail.com'
          git add .github/workflows test/play_closed_test_workflow_contract_test.dart
          git diff --cached --check
          git commit -m 'ci: stop storing APK artifacts on every app change'
          git push origin HEAD:main
