name: One-shot device playback runtime fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-device-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add group runtime lifecycle and data-saver guard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/features/together/application/anywhere_together_runtime.dart')
          s = p.read_text()

          if "../data/anywhere_together_group_host.dart" not in s:
              s = s.replace(
                  "import '../data/anywhere_together_media_bridge.dart';\n",
                  "import '../data/anywhere_together_group_host.dart';\nimport '../data/anywhere_together_media_bridge.dart';\n",
                  1,
              )
          if "import 'together_policy.dart';" not in s:
              s = s.replace(
                  "import 'together_session_controller.dart';\n",
                  "import 'together_session_controller.dart';\nimport 'together_policy.dart';\n",
                  1,
              )

          invite_end = """class AnywhereTogetherInvite {
            final String roomId;
            final String inviteToken;
            final String guestUsername;
            final DateTime? expiresAt;

            const AnywhereTogetherInvite({
              required this.roomId,
              required this.inviteToken,
              required this.guestUsername,
              this.expiresAt,
            });
          }
          """
          if 'class AnywhereTogetherGroupInvite' not in s:
              group_model = """

          class AnywhereTogetherGroupInvite {
            final List<AnywhereTogetherInvite> invites;

            const AnywhereTogetherGroupInvite({required this.invites});

            int get participantCount => invites.length + 1;
            List<String> get guestUsernames => invites
                .map((invite) => invite.guestUsername)
                .toList(growable: false);
          }
          """
              if invite_end not in s:
                  raise SystemExit('invite model anchor changed')
              s = s.replace(invite_end, invite_end + group_model, 1)

          if 'AnywhereTogetherGroupHost? _groupHost;' not in s:
              s = s.replace(
                  '  AnywhereTogetherPeer? _peer;\n',
                  '  AnywhereTogetherPeer? _peer;\n  AnywhereTogetherGroupHost? _groupHost;\n',
                  1,
              )
              s = s.replace(
                  '  AnywhereTogetherInvite? _invite;\n',
                  '  AnywhereTogetherInvite? _invite;\n  AnywhereTogetherGroupInvite? _groupInvite;\n',
                  1,
              )
              s = s.replace(
                  '  StreamSubscription<AnywhereTogetherPacket>? _packetSub;\n',
                  '  StreamSubscription<AnywhereTogetherPacket>? _packetSub;\n  StreamSubscription<AnywhereTogetherGroupPacket>? _groupPacketSub;\n  StreamSubscription<AnywhereTogetherGroupPeerState>? _groupStateSub;\n  StreamSubscription<AnywhereTogetherGroupPeerError>? _groupErrorSub;\n',
                  1,
              )

          if 'AnywhereTogetherGroupInvite? get groupInvite' not in s:
              s = s.replace(
                  '  AnywhereTogetherInvite? get invite => _invite;\n',
                  '  AnywhereTogetherInvite? get invite => _invite;\n  AnywhereTogetherGroupInvite? get groupInvite => _groupInvite;\n',
                  1,
              )
          s = s.replace(
              '  AnywhereTogetherRole? get role => _peer?.role;\n',
              '  AnywhereTogetherRole? get role => _groupHost?.isNotEmpty == true\n      ? AnywhereTogetherRole.host\n      : _peer?.role;\n',
              1,
          )
          if 'bool get isGroupHost' not in s:
              s = s.replace(
                  '  bool get isGuest => role == AnywhereTogetherRole.guest;\n',
                  '  bool get isGuest => role == AnywhereTogetherRole.guest;\n  bool get isGroupHost => _groupHost?.guestCount != null && (_groupHost?.guestCount ?? 0) > 1;\n',
                  1,
              )

          stream_fallback = """      } else {
                final mediaGuest = AnywhereTogetherMediaGuest(
                  peer: peer,
                  descriptor: descriptor,
                );
          """
          if 'To save mobile data, group Together needs the same media on each phone.' not in s:
              replacement = """      } else if (!descriptor.streamAvailable) {
                throw StateError(
                  'To save mobile data, group Together needs the same media on each phone. '
                  'Use Send or Nearby first, then join the group again.',
                );
              } else {
                final mediaGuest = AnywhereTogetherMediaGuest(
                  peer: peer,
                  descriptor: descriptor,
                );
          """
              if stream_fallback not in s:
                  raise SystemExit('guest media fallback anchor changed')
              s = s.replace(stream_fallback, replacement, 1)

          stop_anchor = """    await _packetSub?.cancel();
              await _peerStateSub?.cancel();
              await _errorSub?.cancel();
          """
          if 'await _groupPacketSub?.cancel();' not in s:
              replacement = """    await _packetSub?.cancel();
              await _peerStateSub?.cancel();
              await _errorSub?.cancel();
              await _groupPacketSub?.cancel();
              await _groupStateSub?.cancel();
              await _groupErrorSub?.cancel();
          """
              if stop_anchor not in s:
                  raise SystemExit('stop subscription anchor changed')
              s = s.replace(stop_anchor, replacement, 1)

          null_anchor = """    _packetSub = null;
              _peerStateSub = null;
              _errorSub = null;
          """
          if '_groupPacketSub = null;' not in s:
              replacement = """    _packetSub = null;
              _peerStateSub = null;
              _errorSub = null;
              _groupPacketSub = null;
              _groupStateSub = null;
              _groupErrorSub = null;
          """
              if null_anchor not in s:
                  raise SystemExit('stop null anchor changed')
              s = s.replace(null_anchor, replacement, 1)

          peer_anchor = """    final mediaHost = _mediaHost;
              final mediaGuest = _mediaGuest;
              final peer = _peer;
              _mediaHost = null;
              _mediaGuest = null;
              _peer = null;
              await mediaHost?.stop();
              await mediaGuest?.stop();
              await peer?.dispose();
          """
          if 'final groupHost = _groupHost;' not in s:
              replacement = """    final mediaHost = _mediaHost;
              final mediaGuest = _mediaGuest;
              final peer = _peer;
              final groupHost = _groupHost;
              _mediaHost = null;
              _mediaGuest = null;
              _peer = null;
              _groupHost = null;
              await mediaHost?.stop();
              await mediaGuest?.stop();
              await peer?.dispose();
              await groupHost?.close();
          """
              if peer_anchor not in s:
                  raise SystemExit('stop peer anchor changed')
              s = s.replace(peer_anchor, replacement, 1)

          if '_groupInvite = null;' not in s:
              s = s.replace(
                  '    _invite = null;\n',
                  '    _invite = null;\n    _groupInvite = null;\n',
                  1,
              )

          required = [
              'class AnywhereTogetherGroupInvite',
              'AnywhereTogetherGroupHost? _groupHost;',
              'AnywhereTogetherGroupInvite? get groupInvite',
              'bool get isGroupHost',
              'descriptor.streamAvailable',
              'await groupHost?.close();',
          ]
          if any(item not in s for item in required):
              raise SystemExit('group lifecycle patch incomplete')
          p.write_text(s)
          PY

          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add lib/features/together/application/anywhere_together_runtime.dart
          git commit -m 'feat(together): add group runtime lifecycle and data guard'
          git push origin HEAD:main
