name: One-shot device playback runtime fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-device-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Allow in-app Together join without copied token
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/features/together/application/anywhere_together_runtime.dart')
          s = p.read_text()
          old = """  Future<AnywherePlaybackPlan> joinGuest({
            required String roomId,
            required String inviteToken,
            required Player player,
          """
          new = """  Future<AnywherePlaybackPlan> joinGuest({
            required String roomId,
            String inviteToken = '',
            required Player player,
          """
          if old in s:
              s = s.replace(old, new, 1)
          elif "String inviteToken = ''" not in s:
              raise SystemExit('joinGuest signature changed')
          p.write_text(s)
          PY
          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add lib/features/together/application/anywhere_together_runtime.dart
          git commit -m 'feat(together): join pending invitation without link'
          git push origin HEAD:main
