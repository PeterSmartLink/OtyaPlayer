name: One-shot device playback runtime fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-device-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Allow in-app Together join without copied token
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/features/together/application/anywhere_together_runtime.dart')
          s = p.read_text()
          marker = "    required String inviteToken,\n"
          if "    String inviteToken = '',\n" not in s:
              if s.count(marker) != 1:
                  raise SystemExit(f'expected one invite token parameter, found {s.count(marker)}')
              s = s.replace(marker, "    String inviteToken = '',\n", 1)
          p.write_text(s)
          PY
          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add lib/features/together/application/anywhere_together_runtime.dart
          git commit -m 'feat(together): join pending invitation without link'
          git push origin HEAD:main
