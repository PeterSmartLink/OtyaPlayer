name: One-shot device playback runtime fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-device-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add low-data group media descriptor and roster packet
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          protocol = Path('lib/features/together/data/anywhere_together_protocol.dart')
          ps = protocol.read_text()
          if "    'roster',\n" not in ps:
              marker = "    'media',\n"
              if marker not in ps:
                  raise SystemExit('protocol media type anchor changed')
              ps = ps.replace(marker, marker + "    'roster',\n", 1)
          protocol.write_text(ps)

          bridge = Path('lib/features/together/data/anywhere_together_media_bridge.dart')
          s = bridge.read_text()
          if 'final bool streamAvailable;' not in s:
              s = s.replace(
                  '  final int durationMs;\n',
                  '  final int durationMs;\n  final bool streamAvailable;\n',
                  1,
              )
              s = s.replace(
                  '    this.mimeType,\n  });\n',
                  '    this.mimeType,\n    this.streamAvailable = true,\n  });\n',
                  1,
              )
          if "'stream_available': streamAvailable" not in s:
              s = s.replace(
                  "        'duration_ms': durationMs,\n",
                  "        'duration_ms': durationMs,\n        'stream_available': streamAvailable,\n",
                  1,
              )
          if "final streamAvailable = json['stream_available'];" not in s:
              s = s.replace(
                  "    final mimeType = json['mime_type'];\n",
                  "    final mimeType = json['mime_type'];\n    final streamAvailable = json['stream_available'];\n",
                  1,
              )
          if 'streamAvailable: streamAvailable is bool ? streamAvailable : true' not in s:
              s = s.replace(
                  "          : null,\n    );\n",
                  "          : null,\n      streamAvailable: streamAvailable is bool ? streamAvailable : true,\n    );\n",
                  1,
              )
          required = [
              'final bool streamAvailable;',
              "'stream_available': streamAvailable",
              "final streamAvailable = json['stream_available'];",
              'streamAvailable: streamAvailable is bool ? streamAvailable : true',
          ]
          if any(item not in s for item in required):
              raise SystemExit('descriptor low-data patch incomplete')
          bridge.write_text(s)
          PY

          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add lib/features/together/data/anywhere_together_protocol.dart lib/features/together/data/anywhere_together_media_bridge.dart
          git commit -m 'feat(together): add low-data group transport metadata'
          git push origin HEAD:main
