name: One-shot device playback runtime fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-device-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add low-data group media descriptor and roster packet
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          protocol = Path('lib/features/together/data/anywhere_together_protocol.dart')
          ps = protocol.read_text()
          if "    'roster',\n" not in ps:
              marker = "    'media',\n"
              if marker not in ps:
                  raise SystemExit('protocol media type anchor changed')
              ps = ps.replace(marker, marker + "    'roster',\n", 1)
          protocol.write_text(ps)

          bridge = Path('lib/features/together/data/anywhere_together_media_bridge.dart')
          s = bridge.read_text()
          old_fields = """  final String? mimeType;
            final int durationMs;

            const AnywhereMediaDescriptor({
              required this.fingerprint,
              required this.byteLength,
              required this.durationMs,
              this.mimeType,
            });
          """
          new_fields = """  final String? mimeType;
            final int durationMs;
            final bool streamAvailable;

            const AnywhereMediaDescriptor({
              required this.fingerprint,
              required this.byteLength,
              required this.durationMs,
              this.mimeType,
              this.streamAvailable = true,
            });
          """
          if old_fields in s:
              s = s.replace(old_fields, new_fields, 1)
          elif 'final bool streamAvailable;' not in s:
              raise SystemExit('descriptor field anchor changed')

          old_json = """        'duration_ms': durationMs,
                if (mimeType != null) 'mime_type': mimeType,
              };
          """
          new_json = """        'duration_ms': durationMs,
                'stream_available': streamAvailable,
                if (mimeType != null) 'mime_type': mimeType,
              };
          """
          if old_json in s:
              s = s.replace(old_json, new_json, 1)
          elif "'stream_available': streamAvailable" not in s:
              raise SystemExit('descriptor json anchor changed')

          old_parse = """    final mimeType = json['mime_type'];
              if (fingerprint is! String ||
          """
          new_parse = """    final mimeType = json['mime_type'];
              final streamAvailable = json['stream_available'];
              if (fingerprint is! String ||
          """
          if old_parse in s:
              s = s.replace(old_parse, new_parse, 1)
          elif "json['stream_available']" not in s:
              raise SystemExit('descriptor parse anchor changed')

          old_return = """      durationMs: durationMs,
                mimeType: mimeType is String && mimeType.trim().isNotEmpty
                    ? mimeType.trim()
                    : null,
              );
          """
          new_return = """      durationMs: durationMs,
                mimeType: mimeType is String && mimeType.trim().isNotEmpty
                    ? mimeType.trim()
                    : null,
                streamAvailable: streamAvailable is bool ? streamAvailable : true,
              );
          """
          if old_return in s:
              s = s.replace(old_return, new_return, 1)
          elif 'streamAvailable: streamAvailable is bool ? streamAvailable : true' not in s:
              raise SystemExit('descriptor return anchor changed')

          bridge.write_text(s)
          PY

          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add lib/features/together/data/anywhere_together_protocol.dart lib/features/together/data/anywhere_together_media_bridge.dart
          git commit -m 'feat(together): add low-data group transport metadata'
          git push origin HEAD:main
