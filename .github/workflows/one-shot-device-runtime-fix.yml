name: One-shot device playback runtime fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-device-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Keep Watch Together behind the release gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/features/player/presentation/video_player_screen.dart')
          s = p.read_text()

          import_anchor = "import '../../together/application/nearby_together_session.dart';\n"
          gate_import = "import '../../together/application/together_release_gate.dart';\n"
          if gate_import not in s:
              if import_anchor not in s:
                  raise SystemExit('Together import anchor changed')
              s = s.replace(import_anchor, import_anchor + gate_import, 1)

          entry_anchor = """  Future<void> _showTogetherEntry() async {
            final player = _player;
          """
          if "Watch Together is still being tested" not in s:
              entry_replacement = """  Future<void> _showTogetherEntry() async {
            if (!TogetherReleaseGate.isPubliclyEnabled) {
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Watch Together is still being tested and is not available in this build.',
                    ),
                    backgroundColor: AppColors.surface,
                  ),
                );
              }
              return;
            }

            final player = _player;
          """
              if entry_anchor not in s:
                  raise SystemExit('Together entry anchor changed')
              s = s.replace(entry_anchor, entry_replacement, 1)

          menu_anchor = """            ListTile(
              leading: const Icon(
                Icons.people_alt_rounded,
          """
          gated_menu = """            if (TogetherReleaseGate.isPubliclyEnabled)
              ListTile(
                leading: const Icon(
                  Icons.people_alt_rounded,
          """
          if gated_menu not in s:
              if menu_anchor not in s:
                  raise SystemExit('Together menu anchor changed')
              s = s.replace(menu_anchor, gated_menu, 1)

          required = [
              "import '../../together/application/together_release_gate.dart';",
              'if (!TogetherReleaseGate.isPubliclyEnabled)',
              'if (TogetherReleaseGate.isPubliclyEnabled)',
              'Watch Together is still being tested',
          ]
          if any(item not in s for item in required):
              raise SystemExit('Together release-gate patch incomplete')

          p.write_text(s)
          PY

          dart format lib/features/player/presentation/video_player_screen.dart || true
          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add lib/features/player/presentation/video_player_screen.dart
          git commit -m 'fix(together): hide Watch Together until release gate passes'
          git push origin HEAD:main
