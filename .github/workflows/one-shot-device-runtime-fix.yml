name: One-shot device playback runtime fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-device-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Show Together invitations inside OTYA
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/features/together/presentation/anywhere_together_sheet.dart')
          s = p.read_text()

          import_anchor = "import '../application/anywhere_together_runtime.dart';\n"
          if "../data/together_control_client.dart" not in s:
              if import_anchor not in s:
                  raise SystemExit('runtime import anchor changed')
              s = s.replace(
                  import_anchor,
                  import_anchor + "import '../data/together_control_client.dart';\n",
                  1,
              )

          join_state = r'''class _AnywhereJoinSheetState extends State<_AnywhereJoinSheet> {
            final _inviteController = TextEditingController();
            bool _working = false;
            bool _loadingInvites = true;
            List<TogetherRemoteRoom> _invites = const [];
            String? _error;

            AnywhereTogetherRuntime get _runtime => AnywhereTogetherRuntime.instance;

            @override
            void initState() {
              super.initState();
              _loadInvites();
            }

            @override
            void dispose() {
              _inviteController.dispose();
              super.dispose();
            }

            Future<void> _loadInvites() async {
              if (mounted && !_loadingInvites) {
                setState(() => _loadingInvites = true);
              }
              final result = await TogetherControlClient.instance.pendingInvites();
              if (!mounted) return;
              setState(() {
                _loadingInvites = false;
                _invites = result.value ?? const [];
                if (!result.ok) {
                  _error = result.error;
                } else if (_error == result.error) {
                  _error = null;
                }
              });
            }

            Future<void> _joinPending(TogetherRemoteRoom room) async {
              if (_working) return;
              setState(() {
                _working = true;
                _error = null;
              });
              try {
                final plan = await _runtime.joinGuest(
                  roomId: room.roomId,
                  player: widget.player,
                  candidateMediaItem: widget.currentMediaItem,
                );
                if (!mounted) return;
                Navigator.of(context).pop(plan);
              } catch (_) {
                if (!mounted) return;
                setState(() {
                  _working = false;
                  _error = _runtime.lastError ?? 'OTYA could not join this private room.';
                });
              }
            }

            Future<void> _joinFromLink() async {
              final code = parseAnywhereTogetherInvite(_inviteController.text);
              if (code == null) {
                setState(() => _error = 'Paste a valid older Anywhere Together invite.');
                return;
              }
              setState(() {
                _working = true;
                _error = null;
              });
              try {
                final plan = await _runtime.joinGuest(
                  roomId: code.roomId,
                  inviteToken: code.inviteToken,
                  player: widget.player,
                  candidateMediaItem: widget.currentMediaItem,
                );
                if (!mounted) return;
                Navigator.of(context).pop(plan);
              } catch (_) {
                if (!mounted) return;
                setState(() {
                  _working = false;
                  _error = _runtime.lastError ?? 'OTYA could not join this private room.';
                });
              }
            }

            Widget _pendingInvitesSection() {
              if (_loadingInvites) {
                return const Center(
                  child: Padding(
                    padding: EdgeInsets.symmetric(vertical: 18),
                    child: CircularProgressIndicator(strokeWidth: 2),
                  ),
                );
              }

              if (_invites.isEmpty) {
                return Container(
                  padding: const EdgeInsets.all(14),
                  decoration: BoxDecoration(
                    color: AppColors.surfaceElevated.withValues(alpha: .5),
                    borderRadius: BorderRadius.circular(18),
                    border: Border.all(color: AppColors.borderSubtle),
                  ),
                  child: Row(
                    children: [
                      const Expanded(
                        child: Text(
                          'No pending invitations. A friend only needs your @username to invite you.',
                          style: TextStyle(
                            color: AppColors.textSecondary,
                            fontSize: 12.5,
                            height: 1.4,
                          ),
                        ),
                      ),
                      IconButton(
                        onPressed: _working ? null : _loadInvites,
                        tooltip: 'Refresh invitations',
                        icon: const Icon(Icons.refresh_rounded),
                      ),
                    ],
                  ),
                );
              }

              return Column(
                children: [
                  for (final room in _invites)
                    Container(
                      margin: const EdgeInsets.only(bottom: 10),
                      padding: const EdgeInsets.all(14),
                      decoration: BoxDecoration(
                        color: AppColors.surfaceElevated.withValues(alpha: .72),
                        borderRadius: BorderRadius.circular(18),
                        border: Border.all(color: AppColors.borderSubtle),
                      ),
                      child: Row(
                        children: [
                          const CircleAvatar(
                            backgroundColor: AppColors.surfaceHighlight,
                            child: Icon(
                              Icons.person_rounded,
                              color: AppColors.brandCyan,
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(
                                  room.host.displayName?.trim().isNotEmpty == true
                                      ? room.host.displayName!
                                      : room.host.handle,
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                  style: const TextStyle(
                                    color: AppColors.textPrimary,
                                    fontWeight: FontWeight.w800,
                                  ),
                                ),
                                const SizedBox(height: 2),
                                Text(
                                  '${room.host.handle} invited you to watch Together',
                                  maxLines: 2,
                                  overflow: TextOverflow.ellipsis,
                                  style: const TextStyle(
                                    color: AppColors.textSecondary,
                                    fontSize: 12,
                                  ),
                                ),
                              ],
                            ),
                          ),
                          const SizedBox(width: 10),
                          FilledButton(
                            onPressed: _working ? null : () => _joinPending(room),
                            child: const Text('Join'),
                          ),
                        ],
                      ),
                    ),
                ],
              );
            }

            @override
            Widget build(BuildContext context) {
              final bottom = MediaQuery.viewInsetsOf(context).bottom;
              return AnimatedPadding(
                duration: const Duration(milliseconds: 160),
                padding: EdgeInsets.fromLTRB(18, 12, 18, 22 + bottom),
                child: SingleChildScrollView(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      const _SheetHandle(),
                      const SizedBox(height: 18),
                      const _SheetHeading(
                        icon: Icons.groups_rounded,
                        title: 'Join Anywhere',
                        subtitle: 'Invitations sent to your OTYA username appear here. Matching local media is reused first to save mobile data.',
                      ),
                      const SizedBox(height: 18),
                      _pendingInvitesSection(),
                      if (_error != null) ...[
                        const SizedBox(height: 10),
                        Text(
                          _error!,
                          style: const TextStyle(
                            color: AppColors.error,
                            fontSize: 12.5,
                          ),
                        ),
                      ],
                      const SizedBox(height: 18),
                      const Text(
                        'Older invite link',
                        style: TextStyle(
                          color: AppColors.textMuted,
                          fontSize: 12,
                          fontWeight: FontWeight.w700,
                        ),
                      ),
                      const SizedBox(height: 8),
                      TextField(
                        controller: _inviteController,
                        enabled: !_working,
                        autocorrect: false,
                        keyboardType: TextInputType.url,
                        textInputAction: TextInputAction.done,
                        onSubmitted: (_) => _working ? null : _joinFromLink(),
                        decoration: const InputDecoration(
                          labelText: 'Fallback private invite',
                          hintText: 'otya://together/anywhere?…',
                          prefixIcon: Icon(Icons.lock_outline_rounded),
                        ),
                      ),
                      const SizedBox(height: 14),
                      OutlinedButton.icon(
                        onPressed: _working ? null : _joinFromLink,
                        icon: const Icon(Icons.link_rounded),
                        label: const Text('Join from link'),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          '''

          pattern = r'class _AnywhereJoinSheetState extends State<_AnywhereJoinSheet> \{.*?\n\}\n\nclass _SheetHandle'
          s, count = re.subn(
              pattern,
              join_state.strip() + '\n\nclass _SheetHandle',
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'join state structural replacement count={count}')

          s = s.replace(
              "subtitle: 'Send this private invite only to @${invite.guestUsername}. Keep OTYA open while they join.',",
              "subtitle: 'OTYA invited @${invite.guestUsername} inside the app. They can open Together and tap Join. Keep OTYA open while they connect.',",
              1,
          )
          s = s.replace(
              "label: const Text('Copy private invite'),",
              "label: const Text('Copy fallback invite'),",
              1,
          )

          required = [
              'TogetherControlClient.instance.pendingInvites()',
              '_joinPending(TogetherRemoteRoom room)',
              "child: const Text('Join')",
              "'Older invite link'",
              "labelText: 'Fallback private invite'",
              'Matching local media is reused first to save mobile data.',
          ]
          if any(item not in s for item in required):
              raise SystemExit('join UI patch incomplete')
          p.write_text(s)
          PY

          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add lib/features/together/presentation/anywhere_together_sheet.dart
          git commit -m 'feat(together): show private invitations in app'
          git push origin HEAD:main
