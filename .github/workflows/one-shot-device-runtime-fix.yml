name: One-shot device playback runtime fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-device-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Wire video playback into Otya MediaSession
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/features/player/presentation/video_player_screen.dart')
          text = path.read_text()

          anchor = "import '../../../core/services/auth_provider.dart';"
          if "audio_handler.dart" not in text:
              text = text.replace(
                  anchor,
                  "import '../../../core/services/audio_handler.dart';\n"
                  "import '../../../core/services/audio_session_service.dart';\n"
                  + anchor,
                  1,
              )
          media_anchor = "import '../../../core/services/media_kit_engine.dart';"
          if "media_notification_service.dart" not in text:
              text = text.replace(
                  media_anchor,
                  media_anchor + "\nimport '../../../core/services/media_notification_service.dart';",
                  1,
              )

          attach_lines = [
              "  void _attachPlayer(Player player) {",
              "    if (_player == player) return;",
              "    _positionSub?.cancel();",
              "    _durationSub?.cancel();",
              "    _playingSub?.cancel();",
              "    _player = player;",
              "",
              "    // The video engine owns the real MediaKit Player, so attach that exact",
              "    // instance to Android's MediaSession. The manifest alone cannot expose",
              "    // live notification, lock-screen, Bluetooth or headset controls.",
              "    AudioHandlerSingleton.instance.attachPlayer(player);",
              "    MediaNotificationService.instance.registerTransportCallbacks(",
              "      this,",
              "      onSkipPrevious: () => unawaited(_previous()),",
              "      onSkipNext: () => unawaited(_next()),",
              "    );",
              "    unawaited(AudioSessionService.instance.activate());",
              "    unawaited(",
              "      MediaNotificationService.instance.show(",
              "        id: widget.mediaItem.id,",
              "        title: widget.mediaItem.title,",
              "        artist: 'Video',",
              "        isPlaying: player.state.playing,",
              "        albumArtPath: widget.mediaItem.thumbnailPath,",
              "      ),",
              "    );",
              "",
              "    _positionSub = player.stream.position.listen((position) {",
              "      if (mounted && !_isSeeking) setState(() => _position = position);",
              "    });",
              "    _durationSub = player.stream.duration.listen((duration) {",
              "      if (mounted) setState(() => _duration = duration);",
              "    });",
              "    _playingSub = player.stream.playing.listen((playing) {",
              "      if (mounted) setState(() => _isPlaying = playing);",
              "      unawaited(MediaNotificationService.instance.updatePlayState(playing));",
              "      if (_pipInitialized) {",
              "        unawaited(PipService.instance.setVideoPlaying(playing: playing));",
              "      }",
              "    });",
              "",
              "    final nearby = NearbyTogetherRuntime.instance;",
              "    if (nearby.active) nearby.attachPlayer(player);",
              "    final anywhere = AnywhereTogetherRuntime.instance;",
              "    if (anywhere.active) anywhere.attachPlayer(player);",
              "  }",
          ]
          attach = "\n".join(attach_lines)
          text, count = re.subn(
              r"  void _attachPlayer\(Player player\) \{.*?\n  \}\n\n  Future<void> _leavePlayer",
              attach + "\n\n  Future<void> _leavePlayer",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('could not locate video attach function')

          dispose_lines = [
              "  @override",
              "  void dispose() {",
              "    _hideTimer?.cancel();",
              "    _positionSub?.cancel();",
              "    _durationSub?.cancel();",
              "    _playingSub?.cancel();",
              "    NearbyTogetherRuntime.instance.removeListener(_handleTogetherRuntimeChanged);",
              "    AnywhereTogetherRuntime.instance.removeListener(",
              "      _handleAnywhereTogetherRuntimeChanged,",
              "    );",
              "    final player = _player;",
              "    MediaNotificationService.instance.unregisterTransportCallbacks(this);",
              "    if (player != null) {",
              "      NearbyTogetherRuntime.instance.detachPlayer(player);",
              "      AnywhereTogetherRuntime.instance.detachPlayer(player);",
              "      PlaybackCoordinator.instance.unregister(player);",
              "    }",
              "    if (!_handoffToAnotherVideo) {",
              "      // Clear the system session before MediaKit disposes its native player.",
              "      AudioHandlerSingleton.instance.detachPlayer();",
              "      unawaited(MediaNotificationService.instance.dismiss());",
              "      unawaited(AudioSessionService.instance.deactivate());",
              "      unawaited(NearbyTogetherRuntime.instance.stop());",
              "      unawaited(AnywhereTogetherRuntime.instance.stop());",
              "      Future.microtask(_restoreOrientation);",
              "    }",
              "    WidgetsBinding.instance.removeObserver(this);",
              "    super.dispose();",
              "  }",
          ]
          dispose = "\n".join(dispose_lines)
          text, count = re.subn(
              r"  @override\n  void dispose\(\) \{.*?\n  \}\n\n  @override\n  Widget build",
              dispose + "\n\n  @override\n  Widget build",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('could not locate video dispose function')

          path.write_text(text)

          Path('test/video_system_media_session_contract_test.dart').write_text("""import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            final video = File('lib/features/player/presentation/video_player_screen.dart').readAsStringSync();
            final notifications = File('lib/core/services/media_notification_service.dart').readAsStringSync();

            test('video owns Android MediaSession while its player is active', () {
              expect(video.contains('AudioHandlerSingleton.instance.attachPlayer(player)'), isTrue);
              expect(video.contains('MediaNotificationService.instance.show('), isTrue);
              expect(video.contains('MediaNotificationService.instance.updatePlayState(playing)'), isTrue);
              expect(video.contains('AudioSessionService.instance.activate()'), isTrue);
            });

            test('video transport callbacks restore the previous media owner', () {
              expect(notifications.contains('registerTransportCallbacks('), isTrue);
              expect(notifications.contains('unregisterTransportCallbacks(Object owner)'), isTrue);
              expect(video.contains('onSkipPrevious: () => unawaited(_previous())'), isTrue);
              expect(video.contains('onSkipNext: () => unawaited(_next())'), isTrue);
              expect(video.contains('MediaNotificationService.instance.unregisterTransportCallbacks(this)'), isTrue);
            });

            test('leaving video clears stale system playback state', () {
              expect(video.contains('AudioHandlerSingleton.instance.detachPlayer()'), isTrue);
              expect(video.contains('MediaNotificationService.instance.dismiss()'), isTrue);
              expect(video.contains('AudioSessionService.instance.deactivate()'), isTrue);
            });
          }
          """)

          Path('.github/workflows/one-shot-device-runtime-fix.yml').unlink()
          PY

          dart format lib/features/player/presentation/video_player_screen.dart test/video_system_media_session_contract_test.dart
          git config user.name 'PeterSmart Link'
          git config user.email 'petersmartlink@gmail.com'
          git add lib/features/player/presentation/video_player_screen.dart test/video_system_media_session_contract_test.dart .github/workflows/one-shot-device-runtime-fix.yml
          git commit -m 'fix(player): connect video to system media controls'
          git push origin HEAD:main
